name = "hoquei-relogio"
main = "src/index.js"
compatibility_date = "2026-10-04"

# Os `cron` da Cloudflare são em UTC, como os da GitHub — mas estes disparam.
# 07:00–23:59 em Portugal cobre folgadamente o primeiro jogo (10:00) e o último (21:30).
# São ~100 invocações por dia, contra as 100 000 do plano gratuito.
[triggers]
crons = ["*/10 6-22 * * *"]

# Logs e rastreios guardados no painel da Cloudflare. Sem isto, o que este Worker fez às 03:00
# só se vê se alguém estiver com um `wrangler tail` aberto nesse instante — e este é
# precisamente o Worker que corrige coisas quando ninguém está a olhar.
#
# Amostragem a 100%: são ~100 invocações por dia, não um milhão.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
REPO = "pmontezinho17/HoqueiApp"
WORKFLOW = "aovivo.yml"
# o cão de guarda lança a ronda completa quando a cadeia parte em silêncio
WORKFLOW_DADOS = "dados.yml"
REF = "main"
AGENDA = "https://hoquei.pages.dev/v1/aplisboa/2026-27/agenda.json"
# (O observador deixou de ser um endereço aqui — passou a ligação de serviço, em baixo.)
META = "https://hoquei.pages.dev/v1/aplisboa/2026-27/meta.json"

# GITHUB_TOKEN **não** vive aqui. É um segredo, posto com `wrangler secret put` — ver o
# README ao lado.

# ── O observador, por ligação de serviço e não por endereço ───────────────────────────────
#
# **Um Worker não chama outro pelo endereço `workers.dev`.** Tentou-se a 10/10/2026 e a
# resposta foi **HTTP 404**, enquanto o mesmo endereço respondia 200 a um `curl` de fora e o
# próprio `/observar` do relógio respondia 200 — ou seja, não era um ciclo nem um endereço
# errado: é a Cloudflare a não encaminhar pedidos entre Workers por essa via.
#
# Uma ligação de serviço é o caminho suportado, e é mais barata: o pedido não sai para a
# internet, não gasta um sub-pedido de saída, e não depende de o subdomínio público existir —
# o que importa, porque está em aberto desligá-lo (B9.27).
[[services]]
binding = "OBSERVADOR"
service = "hoquei-observador"
