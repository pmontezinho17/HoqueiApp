name = "hoquei-observador"
main = "src/index.js"
compatibility_date = "2026-10-08"

# **Este Worker não tem `cron`, e isso é a correcção de uma avaria, não uma omissão.**
#
# Tinha `* 17-22 * * 1-5` e `* 8-22 * * SAT,SUN`. A Cloudflare **aceitava-os ao publicar** — o
# `wrangler` confirmava os dois `schedule` no fim de cada deploy — e **nunca os executou**.
# Medido a 09/10/2026, na noite do jogo das 22:00: a última escrita do observador foi às 09:58
# desse dia, e dez minutos de `wrangler tail` apanharam zero invocações agendadas, só os
# pedidos que eu próprio fiz. Mudar para `*/2`, que é a forma que o relógio usa e que funciona,
# não mudou nada. Um disparo temporário na hora corrente também não.
#
# A causa não está encontrada. O candidato mais forte é o limite de **5 cron triggers por
# conta** no plano gratuito — esta conta tem outra aplicação, o `torneiopa` —, mas não o
# consegui confirmar pelo CLI, que não lista os Workers da conta.
#
# **Quem acorda este Worker agora é o relógio**, que dispara de dez em dez minutos e cujo cron
# se vê a funcionar nas corridas da GitHub. Ver o `scheduled` em `worker/relogio/src/index.js`.
# A resolução passa de um minuto para dez — o que chega para dar pelo silêncio, e não chega
# para medir a cadência de um ciclo que publica de 60 em 60 segundos. É o preço de ter um
# relógio emprestado, e está no backlog para ser resolvido.

[vars]
REPO = "pmontezinho17/HoqueiApp"
# O endereço que o aviso põe na issue. **Sem a chave de propósito:** as issues deste
# repositório são públicas, e uma chave numa issue pública é uma chave queimada. Quem abre o
# link acrescenta-a — ou tem a consola nos favoritos, já com ela.
CONSOLA = "https://hoquei.pages.dev/consola"

# Logs e rastreios no painel da Cloudflare, que de outra forma não ficam guardados: sem
# isto, um erro de madrugada só se vê se alguém estiver a olhar para o `wrangler tail`.
# Amostragem a 100% porque isto corre ~1 400 vezes no pior dia, não um milhão.
[observability]
enabled = true
head_sampling_rate = 1

# A base de dados das medições. **Era KV até 09/10/2026** e passou a D1 porque a Cloudflare
# avisou aos 50% das 1 000 escritas/dia do plano gratuito — o raciocínio e os números estão
# em `dados/esquema.sql`. O D1 dá 100 000 linhas escritas por dia e, mais importante, faz as
# somas com `ON CONFLICT` em vez de ler-somar-escrever, que não era atómico.
#
# O mesmo `database_id` está ligado ao projecto de Pages: os contadores do site escrevem nas
# tabelas `visita` e `aparelho`, e a consola lê-as aqui.
[[d1_databases]]
binding = "DADOS"
database_name = "ok4sticks-dados"
database_id = "5eb302a1-a975-40af-a254-7b26a23ef312"
