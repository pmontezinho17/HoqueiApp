name = "hoquei-observador"
main = "src/index.js"
compatibility_date = "2026-10-08"

# De minuto a minuto, e só nas horas em que há jogos.
#
# Os `cron` da Cloudflare são em UTC e Portugal está em UTC+1 no horário de verão: as janelas
# abaixo são 18:00–23:59 nos dias úteis e 09:00–23:59 ao fim de semana, hora de Lisboa. São
# ~1 400 invocações no pior dia, contra as 100 000 do plano gratuito.
#
# Porque de minuto a minuto e não de dez em dez como o relógio: o que se está a medir é a
# cadência de um ciclo que publica de 30 em 30 segundos. Com dez minutos de intervalo, um
# buraco de nove minutos passava invisível.
[triggers]
# `SAT,SUN` e não `6,0` nem `0,6`: a Cloudflare recusa as duas formas numéricas com
# `invalid cron string`, e também recusa `*/1` no campo dos minutos. Experimentado uma a uma
# ao publicar, a 08/10/2026 — os nomes dos dias passam.
crons = [
  "* 17-22 * * 1-5",
  "* 8-22 * * SAT,SUN"
]

[vars]
REPO = "pmontezinho17/HoqueiApp"
# O endereço que o aviso põe na issue. **Sem a chave de propósito:** as issues deste
# repositório são públicas, e uma chave numa issue pública é uma chave queimada. Quem abre o
# link acrescenta-a — ou tem a consola nos favoritos, já com ela.
CONSOLA = "https://hoquei.pages.dev/consola"

# Logs e rastreios no painel da Cloudflare, que de outra forma não ficam guardados: sem
# isto, um erro de madrugada só se vê se alguém estiver a olhar para o `wrangler tail`.
# Amostragem a 100% porque isto corre ~1 400 vezes no pior dia, não um milhão.
[observability]
enabled = true
head_sampling_rate = 1

# A base de dados das medições. **Era KV até 09/10/2026** e passou a D1 porque a Cloudflare
# avisou aos 50% das 1 000 escritas/dia do plano gratuito — o raciocínio e os números estão
# em `dados/esquema.sql`. O D1 dá 100 000 linhas escritas por dia e, mais importante, faz as
# somas com `ON CONFLICT` em vez de ler-somar-escrever, que não era atómico.
#
# O mesmo `database_id` está ligado ao projecto de Pages: os contadores do site escrevem nas
# tabelas `visita` e `aparelho`, e a consola lê-as aqui.
[[d1_databases]]
binding = "DADOS"
database_name = "ok4sticks-dados"
database_id = "5eb302a1-a975-40af-a254-7b26a23ef312"
