name: Site de um ramo

# **Um** site de testes, e só um: `https://testes.hoquei.pages.dev`.
#
# O Cloudflare Pages dá um *preview deployment* por ramo sem custo, e durante umas horas de
# 10/10/2026 aproveitei isso para dar um endereço a cada ramo que criei. O dono parou-me, e
# com razão: *"se temos o site de testes, é SÓ neste que eu quero ter as novas
# funcionalidades"*. Quatro sítios de testes é quatro sítios para alguém se enganar a
# partilhar, quatro cópias de dados a envelhecer em ritmos diferentes, e nenhuma delas é a
# que ele abre.
#
# **Por isso o gatilho é um ramo e não "todos menos o main".** Era `branches-ignore: [main]`,
# e isso punha a regra na minha cabeça em vez de a pôr no ficheiro. Aqui, um ramo novo não
# ganha endereço nenhum: trabalha-se nele à vontade, e quando se quer ver no telemóvel
# funde-se no `testes`.
#
# ## A regra que isto serve, e que nasceu de um erro meu
#
# **O `main` é produção.** A 09/10/2026 comitei para `main` um redesenho que o dono queria ver
# em testes primeiro, e as sete publicações que fiz depois — todas para outras coisas —
# levaram-no ao ar sem ele o ter aprovado. Eu tinha-lhe escrito esse risco por palavras minhas
# e segui a publicar na mesma.
#
# Trabalho não aprovado vive **num ramo**, e o ramo tem o seu próprio endereço. O `main` só
# recebe o que já foi visto.
#
# **O site de testes tem dados seus, e lê-os com o raspador do `dev`.** Decisão do dono a
# 30/10/2026: *"não quero dependência entre ambientes"*. Até então este workflow publicava a cópia
# commitada e a app do site de testes lia os dados de produção — e um ecrã que precisasse de um
# campo novo só se testava depois de o raspador ir ao `main`. Agora:
#
# * os dados do site de testes vivem no R2, em `ok4sticks-historico/testes/v1.tar.gz`, e não no
#   git, para não chocarem com os que o robô comita no `main`;
# * **um merge no `dev` não pede nada à APL**: publica o código novo com os dados do R2;
# * quem quer dados novos carrega em **Run workflow**, escolhe o ramo `dev` e uma finalidade. Cada
#   uma diz o que custa ao servidor da associação, contado a 30/10/2026 — uma ronda normal de
#   produção são 40 pedidos, e ler tudo de raiz são 480 fichas mais 76 páginas de calendários,
#   tabelas e competições.
#
# **Só no botão, por escolha do dono**: zero pedidos quando ninguém está a testar, e a idade dos
# dados é a do último clique. O ciclo ao vivo não corre aqui. E o botão **recusa** pedir enquanto
# o ciclo ao vivo de produção estiver a correr, e espera que acabe uma ronda de produção — dois
# raspadores ao mesmo tempo eram dois pedidos por segundo à APL. Fica uma janela: uma ronda
# agendada de produção que arranque a meio de uma destas. É curta e rara, e está dita aqui.
#
# O contador de utilização fica **calado** aqui, e também é de propósito. Durante uns dias a
# garantia era não haver ligação nenhuma à base de dados neste ambiente — o middleware é um
# `next()` quando não a encontra. **Deixou de ser a 13/10/2026**, quando o dono pediu uma base
# só para testes (`ok4sticks-dados-testes`, ligada como `DADOS` no ambiente de *Preview*) para
# os dois ambientes passarem a diferir só no código.
#
# Quem garante agora é outra coisa, e é mais forte: o `_middleware.js` trata os sites de ramo e
# **sai antes** de chegar ao contador do `visita`. Há um teste só para isso. E mesmo que
# passasse, escrevia na base de testes e não na real. São duas travas onde havia uma, mas a
# primeira — a que estava escrita aqui — já não existe, e por isso não vale citá-la.
#
# ## Estes sites estão trancados desde 10/10/2026
#
# Aquele "algumas horas atrás" era uma limitação conhecida e passou a ser um problema no dia
# em que o endereço do ramo `testes` foi partilhado por engano em vez do de produção. Com 36
# jogos a decorrer, quem seguiu o link via dados de 26 horas antes e nem um resultado do dia.
#
# Agora qualquer navegação a um `*.hoquei.pages.dev` que não seja o site a sério apanha a
# porta do `web/functions/_middleware.js`: uma página que diz onde é o site verdadeiro, com um
# botão, e que só deixa passar quem escreva a `CHAVE_TESTES`. **Esse segredo define-se no
# ambiente `Preview` do projecto, no painel da Cloudflare** — sem ele a porta não deixa entrar
# ninguém, de propósito. O raciocínio todo está em `docs/03-backlog.md`.

on:
  push:
    # **Só o `dev`**, desde 17/10/2026. Era o `testes`, e o ramo mudou de nome porque mudou de
    # papel: deixou de ser "um sítio para ver uma coisa antes de a publicar" e passou a ser
    # **onde as funcionalidades se acumulam** até à segunda-feira. Ver `docs/10-processo.md`.
    #
    # O `main` tem o seu caminho pelo `dados.yml`; qualquer outro ramo não publica em lado
    # nenhum, de propósito — ver o comentário acima.
    branches: [dev]
  workflow_dispatch:
    inputs:
      finalidade:
        description: O que fazer aos dados do site de testes antes de o publicar
        type: choice
        default: só publicar o código — 0 pedidos à APL
        options:
          - só publicar o código — 0 pedidos à APL
          - ronda normal, o que mudou — ~40 pedidos
          - reler as fichas com Mérito — ~120 pedidos (a ronda e mais 82 fichas)
          - reler os jogos indicados abaixo — ~40 pedidos e mais 1 por jogo
          - copiar os dados de produção — 0 pedidos à APL
          - tudo do zero — ~560 pedidos, ~10 minutos
      jogos:
        description: Só para "reler os jogos" — ids separados por vírgulas, por exemplo 9988,9989
        type: string
        default: ''

# **Sem cancelar a corrida em curso.** Era `cancel-in-progress: true`, que servia enquanto isto só
# publicava; agora um merge a meio de uma leitura de dez minutos deitava fora os pedidos já
# feitos à APL. Fica em fila.
concurrency:
  group: ramo-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  # para ver se o ciclo ao vivo ou uma ronda de produção estão a correr
  actions: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      FINALIDADE: ${{ inputs.finalidade || 'só publicar o código — 0 pedidos à APL' }}
      JOGOS: ${{ inputs.jogos }}
      DADOS: web/static/v1/aplisboa/2026-27
    steps:
      # O botão abre no `main`, que é o ramo por omissão do GitHub; publicar o `main` no site de
      # testes era pôr produção lá e chamar-lhe testes.
      - name: Só a partir do dev
        if: github.ref_name != 'dev'
        run: |
          echo "::error::No Run workflow, escolhe o ramo dev — este site publica o dev e mais nenhum."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Os dados do site de testes, do R2
        id: r2
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          command: >-
            r2 object get ok4sticks-historico/testes/v1.tar.gz
            --file=testes-v1.tar.gz
            --remote

      # **Um R2 que não responde nunca apaga os dados do site de testes.** Não se distingue aqui
      # "ainda não há" de "não respondeu", por isso nenhum dos dois leva a escrever no R2: um
      # merge publica com a cópia que o ramo tem e avisa, e uma leitura recusa, porque ler a APL
      # por cima de dados que não são os do site de testes era trabalho deitado fora.
      - name: Por onde começam os dados
        id: origem
        run: |
          set -euo pipefail
          tem_r2=false
          [ "${{ steps.r2.outcome }}" = success ] && [ -s testes-v1.tar.gz ] && tem_r2=true
          pede=false; guardar=false
          case "$FINALIDADE" in
            copiar*) origem=producao; guardar=true ;;
            tudo*)   origem=vazio; pede=true; guardar=true ;;
            só*)     origem=$($tem_r2 && echo r2 || echo ramo) ;;
            *)       $tem_r2 || { echo "::error::Não há dados do site de testes no R2, ou o R2 não respondeu. Corre primeiro com \"copiar os dados de produção\"."; exit 1; }
                     origem=r2; pede=true; guardar=true ;;
          esac
          case $origem in
            r2)       rm -rf web/static/v1 && tar -xzf testes-v1.tar.gz -C web/static ;;
            producao) git fetch -q --depth=1 origin main && rm -rf web/static/v1 && git checkout FETCH_HEAD -- web/static/v1 ;;
            vazio)    rm -rf web/static/v1 && mkdir -p "$DADOS" ;;
            ramo)     echo "::warning::Sem dados do site de testes no R2: publica-se a cópia que o ramo tem. Carrega no botão com \"copiar os dados de produção\" para o site de testes passar a ter os seus." ;;
          esac
          echo "pede=$pede" >> "$GITHUB_OUTPUT"
          echo "guardar=$guardar" >> "$GITHUB_OUTPUT"
          echo "### Dados: $origem — $FINALIDADE" >> "$GITHUB_STEP_SUMMARY"

      - name: Ninguém mais a pedir à APL
        if: steps.origem.outputs.pede == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          a_correr() { gh run list --repo "$GITHUB_REPOSITORY" --workflow "$1" --status in_progress --json databaseId --jq length; }
          for _ in $(seq 1 20); do
            if [ "$(a_correr aovivo.yml)" != 0 ]; then
              echo "::error::O ciclo ao vivo está a correr: há jogos a decorrer e ele já está a pedir à APL. Tenta quando acabarem."
              exit 1
            fi
            [ "$(a_correr dados.yml)" = 0 ] && exit 0
            echo "uma ronda de produção está a correr; espero 30 s"
            sleep 30
          done
          echo "::error::A ronda de produção não acabou em 10 minutos."
          exit 1

      - uses: astral-sh/setup-uv@v5
        if: steps.origem.outputs.pede == 'true'
        with:
          enable-cache: true

      # O diário das contagens vai para uma pasta temporária: o do git é o de produção, e a guarda
      # contra quedas compararia os dados do site de testes com os de outro ambiente.
      - name: Ler a APL com o raspador do dev
        if: steps.origem.outputs.pede == 'true'
        working-directory: scraper
        run: |
          set -euo pipefail
          extra=()
          case "$FINALIDADE" in
            reler\ as*) extra=(--reler merito) ;;
            reler\ os*)
              [[ "$JOGOS" =~ ^[0-9]+(,[0-9]+)*$ ]] || { echo "::error::Escreve os ids dos jogos separados por vírgulas, por exemplo 9988,9989."; exit 1; }
              extra=(--reler "$JOGOS") ;;
          esac
          uv run python -m hoquei.cli publicar --tenant aplisboa --destino "../$DADOS" \
            --rondas "$RUNNER_TEMP/rondas.jsonl" "${extra[@]}"

      - name: Guardar os dados do site de testes no R2
        id: guardar
        if: steps.origem.outputs.guardar == 'true'
        run: tar -czf testes-v1.tar.gz -C web/static v1 && du -h testes-v1.tar.gz

      - name: Enviar para o R2
        if: steps.guardar.outcome == 'success'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          command: >-
            r2 object put ok4sticks-historico/testes/v1.tar.gz
            --file=testes-v1.tar.gz
            --content-type=application/gzip
            --remote

      # Os mesmos testes do `ci.yml`, e **depois** dos dados: vários lêem o `/v1` publicado, e
      # assim verificam os dados que vão mesmo para o site de testes. Um site de testes com
      # código que não passa os testes serve para enganar quem o abre.
      - name: Testes da PWA
        working-directory: web
        run: npm ci && npm run check && npx vitest run

      # `VITE_APP_NOME` é o que separa este site da principal, e existe por uma razão
      # prática: com os dois instalados no mesmo telemóvel, dois ícones com o mesmo nome
      # debaixo não se distinguem — e acaba-se a reportar um defeito do sítio errado.
      - name: Construir a PWA
        working-directory: web
        env:
          VITE_APP_NOME: OK4Sticks.DEV
          # A marca do commit por cima da versão, para o aviso de actualização aparecer a
          # cada fusão no `dev` sem ninguém subir o número — ver `versaoDaConstrucao` no
          # `web/src/lib/versao.ts`. Produção não a recebe, e por isso fica só com o número.
          REVISAO_DE_TESTES: ${{ github.sha }}
        run: npm run build

      # `workingDirectory: web` pela mesma razão do `dados.yml`: as Pages Functions são lidas
      # da pasta `functions/` relativa ao sítio de onde o wrangler corre.
      - name: Publicar no ramo de testes
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          # **A versão do wrangler, fixada, e isto quebrou uma publicação a 09/10/2026.**
          #
          # Por omissão o `wrangler-action@v3` instala `wrangler@3.90.0` dentro do projecto.
          # Funcionou enquanto o `web/` não tinha wrangler nenhum; no dia em que passou a ter
          # `@cloudflare/workers-types@^5` como dependência de desenvolvimento, o `npm i`
          # rebentou com `ERESOLVE` — a 3.90 pede tipos `^4` por peer dependency.
          #
          # Fixar não é só calar o erro: os **dois publicadores** passam a usar a mesma versão.
          # O `scripts/aovivo.sh` publica com o wrangler local, que é 4.x, e este passo
          # publicava com 3.90 — a mesma espécie de divergência de que fala o comentário do
          # `workingDirectory` acima, e com o mesmo sintoma possível: um sábado em que o que
          # vai para o CDN depende de quem publicou.
          wranglerVersion: '4.149.0'
          # **`--branch testes` fixo, e não o nome do ramo do git.** O endereço do site de
          # testes é conhecido, está partilhado e está escrito na política de privacidade e nos
          # documentos; o ramo passou a chamar-se `dev` e o endereço **não** podia mudar com
          # ele. A flag é só o rótulo que a Cloudflare usa para o subdomínio e para escolher o
          # ambiente — nada a obriga a ser igual ao ramo, e o `dados.yml` já usa `--branch main`
          # da mesma maneira.
          command: pages deploy build --project-name hoquei --branch testes

      - name: Onde ficou
        run: |
          # o subdomínio não aceita `/` nem `_`; a Cloudflare troca-os por `-`
          sub=$(echo "${{ github.ref_name }}" | tr '/_' '-' | tr '[:upper:]' '[:lower:]')
          {
            echo "### Este ramo está em"
            echo ""
            echo "https://$sub.hoquei.pages.dev"
            echo ""
            echo "O \`main\` continua em https://hoquei.pages.dev e não foi tocado."
          } >> "$GITHUB_STEP_SUMMARY"
