name: Actualizar dados

# Porquê esta cadência e não mais: cada execução custa ~75 pedidos à fonte (a lista de
# competições e um calendário + classificação por prova), e a fonte é um IIS partilhado de
# uma federação, não uma API. A 2h aos fins-de-semana e 6h nos dias úteis dá uma média de
# um pedido a cada dois minutos, e os resultados aparecem no site em menos de duas horas.
# As fichas de jogo são incrementais: só se busca a de um jogo novo ou com resultado novo.
on:
  schedule:
    # **Fecho do dia, 00:30 WEST.** É a ronda canónica: às 00:30 o dia que acabou está
    # fechado — todos os jogos jogados, todas as fichas disponíveis — e a mesma corrida
    # republica a agenda, que é o que estabelece os jogos de hoje para a ronda ao vivo
    # trabalhar em cima. Um jogo antecipado ou adiado entra por aqui.
    - cron: '30 23 * * *'
    - cron: '0 8-22/2 * * 6,0'   # fins-de-semana, de 2 em 2 horas (UTC)
    - cron: '0 */6 * * 1-5'      # dias úteis, de 6 em 6 horas
    # sexta ao serão: há jornadas às 19:30 e, só com o cron de 6h, o resultado
    # ficava por publicar até às 00:06 — quase cinco horas depois do apito final
    - cron: '0 21 * * 5'
  workflow_dispatch:
    inputs:
      publicar_sempre:
        description: Publicar mesmo sem dados novos (para levar código novo ao site)
        type: boolean
        default: true

concurrency:
  group: dados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Testes do parser
        working-directory: scraper
        run: uv run pytest -q

      # B9.6: se as contagens caírem acima do limiar, este passo sai com 2 e os passos
      # seguintes não correm — nem comita, nem publica. O runner é descartável, por isso
      # os dados suspeitos morrem aqui. O diário fica em data-samples/rondas/.
      - name: Regenerar /v1
        working-directory: scraper
        run: uv run python -m hoquei.cli publicar --tenant aplisboa --destino ../web/static/v1/aplisboa/2026-27

      - name: Comitar se houver novidade
        id: commit
        run: |
          # O meta.json tem um carimbo temporal que muda em TODAS as corridas, por isso
          # não serve para decidir se houve novidade: sem o excluir, isto comitava e
          # publicava de 2 em 2 horas para sempre, sem nada ter acontecido nos jogos.
          if git diff --quiet -- web/static/v1 ':!web/static/v1/**/meta.json'; then
            echo "sem alterações nos dados"
            git checkout -- web/static/v1
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mudou=true" >> "$GITHUB_OUTPUT"
          git config user.name  "hoquei-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # O diário das contagens vai no mesmo commit, mas **fora** de web/static/v1:
          # lá dentro, uma linha nova por ronda fazia a verificação acima ver sempre
          # alterações e publicar de 2 em 2 horas para sempre.
          git add web/static/v1 data-samples/rondas
          git commit -m "Dados: $(date -u '+%Y-%m-%d %H:%M') UTC [skip ci]"
          git push

      # Sem este passo o ciclo não fecha: a Action comitava dados novos e o site
      # continuava a servir os antigos até alguém publicar à mão.
      # `mudou` **ou** um pedido manual. Sem a segunda metade, um commit que mexa só em
      # código ficava no repositório sem chegar ao site até os dados mudarem por conta
      # própria — num dia sem jogos, dias.
      - uses: actions/setup-node@v4
        if: steps.commit.outputs.mudou == 'true' || inputs.publicar_sempre
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Construir a PWA
        if: steps.commit.outputs.mudou == 'true' || inputs.publicar_sempre
        working-directory: web
        run: npm ci && npm run build

      - name: Publicar no Cloudflare Pages
        if: steps.commit.outputs.mudou == 'true' || inputs.publicar_sempre
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/build --project-name hoquei --branch main
