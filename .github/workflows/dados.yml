name: Actualizar dados

# Porquê esta cadência e não mais: cada execução custa ~75 pedidos à fonte (a lista de
# competições e um calendário + classificação por prova), e a fonte é um IIS partilhado de
# uma federação, não uma API. A 2h aos fins-de-semana e 6h nos dias úteis dá uma média de
# um pedido a cada dois minutos, e os resultados aparecem no site em menos de duas horas.
# As fichas de jogo são incrementais: só se busca a de um jogo novo ou com resultado novo.
#
# **E num dia sem jogos não se pede nada** — ver o passo "Há razão para pedir à fonte?".
# Estes `cron` disparam todos os dias, mas a ronda sai sem tocar na APL quando a agenda diz
# que hoje não há jogos. Medido a 08/10/2026: eram 28% de tudo o que pediríamos até dezembro.
on:
  schedule:
    # **Fecho do dia, 00:30 WEST.** É a ronda canónica: às 00:30 o dia que acabou está
    # fechado — todos os jogos jogados, todas as fichas disponíveis — e a mesma corrida
    # republica a agenda, que é o que estabelece os jogos de hoje para a ronda ao vivo
    # trabalhar em cima. Um jogo antecipado ou adiado entra por aqui.
    - cron: '30 23 * * *'
    - cron: '0 8-22/2 * * 6,0'   # fins-de-semana, de 2 em 2 horas (UTC)
    - cron: '0 */6 * * 1-5'      # dias úteis, de 6 em 6 horas
    # sexta ao serão: há jornadas às 19:30 e, só com o cron de 6h, o resultado
    # ficava por publicar até às 00:06 — quase cinco horas depois do apito final
    - cron: '0 21 * * 5'
  # **Uma entrada no `main` publica, e isso é de propósito.**
  #
  # O dono ligou a integração Git do Cloudflare Pages a 14/10/2026 para não depender de mim
  # para publicar — objectivo certo, e é para ficar. O que estava errado era quem construía: a
  # Cloudflare constrói com as definições dela, que não sabem que a app vive em `web/` nem que
  # as Functions estão em `web/functions`. Resultado medido a 15/10 às 08:42, com produção a
  # servir só ficheiros estáticos: `/contar`, `/consola` e `/jogo/999999` todos a 404, e o
  # `_headers` por aplicar. **E o alias daquela mesma publicação dava 404 também** — foi isso
  # que separou este caso do de 13/10, onde o alias servia tudo bem e a culpa era da
  # configuração do anfitrião.
  #
  # Então o comportamento mantém-se e troca-se quem o faz: é **este** workflow que passa a
  # publicar ao fundir, porque é o que constrói como deve ser, corre os dois conjuntos de
  # testes e **pergunta ao site** se o que lá está é o que mandámos. A integração da Cloudflare
  # desliga-se por ter ficado redundante, não por a automatização ser má.
  #
  # Não entra em ciclo: os commits de dados que este workflow faz levam `[skip ci]`, e a
  # GitHub não cria corridas para esses.
  push:
    branches: [main]
    # Um documento não muda o site. Evita uma construção e uma publicação por nada.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

  workflow_dispatch:
    inputs:
      publicar_sempre:
        description: Publicar mesmo sem dados novos (para levar código novo ao site)
        type: boolean
        default: true
      fotografia:
        description: Guardar a fotografia do dia no R2 (a ronda das 00:30 fá-lo sozinha)
        type: boolean
        default: false
      so_fotografia:
        description: Só a fotografia — não pede nada à fonte nem publica
        type: boolean
        default: false
      so_publicar:
        description: Só publicar o que está commitado — não pede nada à fonte
        type: boolean
        default: false

concurrency:
  group: dados
  cancel-in-progress: false

permissions:
  contents: write
  # para o aviso do fim deste ficheiro poder abrir e fechar a issue da ronda
  issues: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    env:
      # **"Só publicar" passa a ser uma pergunta só, e não três condições repetidas.**
      # Um `push` no `main` é exactamente isso: levar ao site o que já está commitado, sem
      # pedir nada à fonte. Antes isto estava escrito em quatro sítios como `inputs.so_publicar`
      # e acrescentar o gatilho novo obrigava a mexer nos quatro — que é como se esquece um.
      SO_PUBLICAR: ${{ inputs.so_publicar || github.event_name == 'push' }}
    steps:
      # `fetch-depth: 0`, e isto é o que faz a nova tentativa de `push` funcionar (P11.12).
      #
      # Por omissão o checkout é raso — um commit só — e um `pull --rebase` sobre uma história
      # rasa falha por não encontrar antepassado comum. Medido a 07/10/2026: o repositório
      # inteiro são **2,64 MiB e 137 commits**, portanto trazer tudo não custa nada de
      # relevante. Se um dia a história pesar — os commits de dados são ~10 por dia —, a
      # alternativa é manter o checkout raso e fazer `git fetch --unshallow` só no caminho da
      # nova tentativa.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # ─────────────────────────────────────────────────────────────────────────────────────
      # Num dia sem jogos, não se pede nada à fonte.
      #
      # O dono apanhou-me a 08/10/2026: *"só faz sentido termos pedidos ao site da APL quando
      # eu tenho a certeza de que há jogos nesse dia"*. Medido: nos 9 dias anteriores correram
      # 53 rondas e só 23 trouxeram dados novos. Até dezembro, 28 dias sem jogos valem ~10 900
      # pedidos, dos quais ~8 800 evitáveis — 28% de tudo o que vamos pedir à fonte.
      #
      # A regra vive em `hoquei.vale_pedir`, com nove testes, e não aqui: lógica dentro de um
      # YAML é lógica sem testes. Ela responde sem custar um pedido, lendo a agenda do nosso
      # próprio CDN — e **em dúvida corre**, porque uma ronda a mais custa 75 pedidos e uma a
      # menos custa uma tarde de resultados errados.
      # **Quem pediu esta publicação, escrito no resumo da corrida.** Com três gatilhos — o
      # agendamento, o botão e a entrada no `main` — quem abre uma corrida vermelha precisa de
      # saber qual deles foi antes de perceber o resto.
      - name: Porque é que esta corrida existe
        run: |
          case "${{ github.event_name }}" in
            push)     porque="entrou algo no \`main\` (${{ github.event.head_commit.id }})" ;;
            schedule) porque="agendamento \`${{ github.event.schedule }}\`" ;;
            *)        porque="pedido à mão por @${{ github.actor }}" ;;
          esac
          echo "### $porque" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Só publicar o que está commitado: \`${{ env.SO_PUBLICAR }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Há razão para pedir à fonte?
        id: vale
        working-directory: scraper
        run: |
          uv run python -m hoquei.vale_pedir \
            --cron "${{ github.event.schedule }}" \
            ${{ inputs.publicar_sempre && '--forcar' || '' }} \
            ${{ (inputs.so_fotografia || env.SO_PUBLICAR == 'true') && '--nao-pedir' || '' }} >> "$GITHUB_OUTPUT"

      - name: Nada a pedir à fonte
        if: steps.vale.outputs.correr != 'true'
        run: |
          {
            echo "### Ronda saltada"
            echo ""
            echo "${{ steps.vale.outputs.porque }} — nenhum pedido feito à APL."
            echo ""
            echo "A ronda das 00:30 corre sempre, e é ela que estabelece o dia seguinte."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Testes do parser
        working-directory: scraper
        # **Sem os marcados `fonte`.** Esses comparam o nosso cálculo com a tabela que a APL
        # publica *naquele momento*, e falham por duas razões que não se parecem nada: o
        # nosso parser partiu-se, ou a APL está incoerente consigo mesma.
        #
        # A 11/10/2026 foi a segunda — um golo de diferença num jogo do sub-15 série B — e
        # abortou **sete rondas seguidas**, das 16:10 às 06:09 do dia seguinte. Dezesseis
        # horas sem publicar resultados, agenda nem fichas, por causa de uma linha de uma
        # tabela de uma competição. E com um efeito de segunda ordem pior: o ciclo ao vivo lê
        # o último commit, e sem commits novos passou a repedir jogos que já tinha visto —
        # **+4 400 pedidos ao servidor da associação nesse dia**.
        #
        # Um teste escrito para proteger a integridade dos dados foi o que nos pôs a martelar
        # a fonte. Daí a separação.
        run: uv run pytest -q -m "not fonte"

      - name: Reprodução das tabelas da fonte (avisa, não bloqueia)
        id: reproducao
        working-directory: scraper
        continue-on-error: true
        run: uv run pytest -q -m fonte

      # B9.6: se as contagens caírem acima do limiar, este passo sai com 2 e os passos
      # seguintes não correm — nem comita, nem publica. O runner é descartável, por isso
      # os dados suspeitos morrem aqui. O diário fica em data-samples/rondas/.
      - name: Regenerar /v1
        if: steps.vale.outputs.correr == 'true'
        working-directory: scraper
        run: uv run python -m hoquei.cli publicar --tenant aplisboa --destino ../web/static/v1/aplisboa/2026-27

      - name: Comitar se houver novidade
        id: commit
        if: steps.vale.outputs.correr == 'true'
        run: |
          # O meta.json tem um carimbo temporal que muda em TODAS as corridas, por isso
          # não serve para decidir se houve novidade: sem o excluir, isto comitava e
          # publicava de 2 em 2 horas para sempre, sem nada ter acontecido nos jogos.
          if git diff --quiet -- web/static/v1 ':!web/static/v1/**/meta.json'; then
            echo "sem alterações nos dados"
            git checkout -- web/static/v1
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mudou=true" >> "$GITHUB_OUTPUT"
          git config user.name  "hoquei-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # O diário das contagens vai no mesmo commit, mas **fora** de web/static/v1:
          # lá dentro, uma linha nova por ronda fazia a verificação acima ver sempre
          # alterações e publicar de 2 em 2 horas para sempre.
          git add web/static/v1 data-samples/rondas
          git commit -m "Dados: $(date -u '+%Y-%m-%d %H:%M') UTC [skip ci]"

          # O `push` com nova tentativa, e não um `push` seco (P11.12).
          #
          # Esta corrida faz `checkout` no início e empurra um a dois minutos depois, com a
          # raspagem pelo meio. Quem commitar nesse intervalo — uma pessoa a publicar uma
          # correcção — faz este `push` ser rejeitado, e com `shell: bash -e` o job morria
          # aqui: a ronda perdia os dados e os passos de construir e publicar ficavam por
          # correr. Aconteceu a 06/10/2026, na corrida 37537581781, e falhou do lado seguro
          # — mas perdeu 150 ficheiros daquela ronda.
          #
          # O `--rebase` é seguro **porque estes ficheiros são gerados e não editados à mão**:
          # o que vem de `origin/main` é dados de uma ronda anterior ou código, e a nossa
          # árvore é a raspagem de agora. O `aovivo.sh` já fazia o equivalente, comparando
          # contra `origin/main:web/static/v1` em vez de assumir que a cópia local está
          # actual; faltava aqui.
          for tentativa in 1 2 3; do
            if git push; then
              echo "publicado no repositório à tentativa $tentativa"
              break
            fi
            if [ "$tentativa" = 3 ]; then
              echo "::error::três tentativas de push rejeitadas — alguém está a commitar sem parar"
              exit 1
            fi
            echo "push rejeitado; a trazer o que chegou entretanto e a tentar outra vez"
            git pull --rebase --autostash origin main
          done

      # **`so_publicar` existe porque publicar não pode depender da fonte.** A 09/10/2026,
      # com uma correcção pronta e urgente, o servidor da associação ficou em baixo e o
      # `Regenerar /v1` falhava — levando com ele o build e a publicação. Código novo não
      # chegava ao site por causa de um servidor que não é nosso. Com este disparo a corrida
      # salta a fonte, constrói a PWA a partir dos dados commitados, e publica.
      #
      # Sem este passo o ciclo não fecha: a Action comitava dados novos e o site
      # continuava a servir os antigos até alguém publicar à mão.
      # `mudou` **ou** um pedido manual. Sem a segunda metade, um commit que mexa só em
      # código ficava no repositório sem chegar ao site até os dados mudarem por conta
      # própria — num dia sem jogos, dias.
      - uses: actions/setup-node@v4
        if: (steps.vale.outputs.correr == 'true' && (steps.commit.outputs.mudou == 'true' || inputs.publicar_sempre)) || env.SO_PUBLICAR == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Construir a PWA
        if: (steps.vale.outputs.correr == 'true' && (steps.commit.outputs.mudou == 'true' || inputs.publicar_sempre)) || env.SO_PUBLICAR == 'true'
        working-directory: web
        run: npm ci && npm run build

      # `workingDirectory: web`, e isto não é arrumação.
      #
      # As Pages Functions são lidas da pasta `functions/` **relativa ao sítio de onde o
      # wrangler corre**. Este passo corria da raiz e o `scripts/aovivo.sh` corre de `web/`:
      # com o contador em `web/functions/`, um dos dois publicadores levava-o e o outro
      # publicava sem ele — e durante uma janela de jogos quem publica mais é o ciclo ao vivo.
      # O resultado seria um contador que desaparece ao sábado à tarde e volta sozinho.
      - name: Publicar no Cloudflare Pages
        id: publicacao
        if: (steps.vale.outputs.correr == 'true' && (steps.commit.outputs.mudou == 'true' || inputs.publicar_sempre)) || env.SO_PUBLICAR == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          # **A versão do wrangler, fixada, e isto quebrou uma publicação a 09/10/2026.**
          #
          # Por omissão o `wrangler-action@v3` instala `wrangler@3.90.0` dentro do projecto.
          # Funcionou enquanto o `web/` não tinha wrangler nenhum; no dia em que passou a ter
          # `@cloudflare/workers-types@^5` como dependência de desenvolvimento, o `npm i`
          # rebentou com `ERESOLVE` — a 3.90 pede tipos `^4` por peer dependency.
          #
          # Fixar não é só calar o erro: os **dois publicadores** passam a usar a mesma versão.
          # O `scripts/aovivo.sh` publica com o wrangler local, que é 4.x, e este passo
          # publicava com 3.90 — a mesma espécie de divergência de que fala o comentário do
          # `workingDirectory` acima, e com o mesmo sintoma possível: um sábado em que o que
          # vai para o CDN depende de quem publicou.
          wranglerVersion: '4.149.0'
          command: pages deploy build --project-name hoquei --branch main

      # ───────────────────────────────────────────────────────────────────────────────────
      # **Pedir ao site publicado, depois de publicar.**
      #
      # A 12/10/2026 a publicação das 23:42 enviou tudo — o log do wrangler diz `Uploading
      # Functions bundle`, `_headers` e `_redirects` — e o `hoquei.pages.dev` serviu **só os
      # ficheiros estáticos durante 18 horas**: sem consola, sem contador, com os links
      # directos de jogo a dar 404, e com o `/v1/*` a vir com a cache por omissão da
      # Cloudflare (**sete dias** em vez dos nossos 20 segundos). O alias daquela publicação
      # servia as três coisas corretamente todo o tempo.
      #
      # **O CI não podia ter apanhado isto**, e é esse o ponto: os testes correram verdes nesse
      # commit e estavam certos. O código estava bem, o build estava bem, o upload estava bem.
      # A única coisa que apanha esta classe de avaria é pedir ao site depois de publicar.
      #
      # Não reverte nada: quando falha, o site já está no ar e já está mal, e o que se quer é
      # o aviso. Quem avisa é o passo "A ronda falhou", que já diz se o site foi publicado.
      - name: O site publicado serve o que lhe mandámos
        if: steps.publicacao.outcome == 'success'
        run: python3 scripts/verificar_producao.py

      # ───────────────────────────────────────────────────────────────────────────────────
      # A fotografia do dia.
      #
      # **Uma por dia, e só a da ronda das 00:30.** É essa a ronda canónica: às 00:30 o dia
      # que acabou está fechado — todos os jogos jogados, todas as fichas disponíveis. Uma
      # segunda fotografia às 23:00, que o dono chegou a considerar, não acrescentaria nada:
      # o que ela apanhasse seria sempre um dia por fechar, e a das 00:30 apanha-o fechado
      # umas horas depois.
      #
      # **Porquê guardar isto se o git já guarda todas as rondas.** Guarda, e isso foi medido
      # a 09/10/2026: 24 commits de dados, ~278 KB de objectos novos cada um. Dois motivos
      # para a fotografia existir à mesma. O primeiro é a forma: um `tar.gz` de 506 KB
      # devolve o dia inteiro num comando, contra reconstruí-lo de uma árvore git. O segundo
      # é o que vem a seguir: se um dia os commits de dados pesarem de mais — e crescem todos
      # os dias —, a saída é deixar de os commitar, e isso só é possível se o histórico já
      # viver noutro sítio.
      #
      # ~506 KB por dia dão ~185 MB ao ano, contra os 10 GB do plano gratuito do R2.
      - name: Preparar a fotografia do dia
        id: foto
        if: github.event.schedule == '30 23 * * *' || inputs.fotografia || inputs.so_fotografia
        run: |
          set -euo pipefail
          # **O dia que a fotografia fecha, e não o dia em que foi tirada.** A ronda das 00:30
          # de Lisboa corre já depois da meia-noite, logo o que ela sela é o dia anterior.
          # Antes das 06:00 conta como a madrugada do dia que acabou; depois disso, é o
          # próprio dia — uma fotografia tirada à mão a meio da tarde é provisória, e a ronda
          # das 00:30 da manhã seguinte substitui-a pela definitiva com a mesma chave.
          hora=$(TZ=Europe/Lisbon date +%H)
          if [ "$hora" -lt 06 ]; then
            dia=$(TZ=Europe/Lisbon date -d yesterday +%F)
          else
            dia=$(TZ=Europe/Lisbon date +%F)
          fi
          tar -czf "fotografia.tar.gz" -C web/static v1
          echo "dia=$dia" >> "$GITHUB_OUTPUT"
          echo "Fotografia de $dia — $(du -h fotografia.tar.gz | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      # `continue-on-error`, e é a regra que manda aqui: **uma medição perdida não pode parar
      # a publicação.** Este passo corre depois de os dados já estarem no CDN; se o R2 não
      # estiver ligado, ou o token não tiver permissão, perde-se uma fotografia e mais nada.
      - name: Guardar a fotografia no R2
        if: steps.foto.outcome == 'success'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          command: >-
            r2 object put
            ok4sticks-historico/fotografias/${{ steps.foto.outputs.dia }}.tar.gz
            --file=fotografia.tar.gz
            --content-type=application/gzip
            --remote

      # ─── Avisos ─────────────────────────────────────────────────────────────────────────
      #
      # **Nada vigiava este workflow.** A 11/10/2026 ele falhou sete vezes seguidas e o
      # primeiro sinal chegou sete horas depois, pela cadeia do observador — que vigia os
      # dados publicados, não o pipeline, e por isso apontou para o sintoma ("ao vivo preso
      # em 9598…") e nunca disse que a ronda estava a abortar.
      #
      # Uma issue por causa, reutilizada e fechada sozinha, como no `aviso.yml`.

      # **Um aviso que falha não pode reprovar uma ronda que publicou.** Foi o que aconteceu
      # a 12/10/2026, na publicação da 1.1: o site foi actualizado com sucesso e a corrida
      # ficou vermelha porque este passo não conseguiu pôr uma etiqueta — e o `if: failure()`
      # do passo seguinte disparou e falhou pela mesma razão. Resultado: uma corrida vermelha,
      # zero avisos abertos, e um site publicado. Exactamente o contrário do que estes passos
      # existem para fazer.
      - name: A fonte está incoerente
        if: steps.reproducao.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DONO: ${{ github.repository_owner }}
        run: |
          # **A etiqueta tem de existir antes de se usar** — o `gh issue create --label` não a
          # cria, recusa com `could not add label`. A lição é de 10/10/2026 e estava escrita
          # no `vigia.yml` e no `aviso.yml`; estes dois passos nasceram a 11/10 sem ela.
          gh label create fonte --color D4C5F9 --force \
            --description "a fonte da APL discorda de si mesma" >/dev/null 2>&1 || true

          titulo="A fonte discorda de si mesma — $(TZ=Europe/Lisbon date +%F)"
          corpo=$(printf '%s\n' \
            "A tabela que a APL publica não bate com os jogos do calendário dela." \
            "" \
            "**A ronda publicou mesmo assim**, e é de propósito: uma incoerência passageira" \
            "da fonte não é razão para deixar todos sem resultados. A app mostra a tabela" \
            "**da fonte** nas provas em que ela existe, e por isso o que se vê é o atraso dela." \
            "" \
            "Se isto não desaparecer em dois ou três dias, aí sim vale a pena desconfiar do" \
            "nosso cálculo e correr \`uv run pytest -m fonte\` para ver as divergências linha" \
            "a linha." \
            "" \
            "Corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          n=$(gh issue list --state open --label fonte --limit 20 --json number,title \
                --jq "[.[] | select(.title == \"$titulo\")] | .[0].number // empty")
          # **Se já está aberto, cala-se.** O aviso do dia é o sinal; a ronda corre de duas em
          # duas horas e um comentário por ronda são doze por dia a dizer o mesmo, o que
          # ensina a ignorar a notificação. A incoerência da fonte é crónica por natureza —
          # vive enquanto a APL não corrigir a tabela dela — e o histórico das corridas tem o
          # detalhe de cada uma para quem o quiser.
          if [ -z "$n" ]; then
            gh issue create --title "$titulo" --body "$corpo" --label fonte --assignee "$DONO"
          fi

      # **Este aviso não tinha fecho nenhum**, e isso são duas issues abertas a 13/10/2026
      # (#23 de 12/10 e #25 de 13/10) que ninguém ia fechar senão à mão — uma por dia,
      # enquanto a APL não corrigir a tabela dela. Um aviso que se acumula é um aviso que se
      # aprende a ignorar, e o `aviso.yml` pagou a mesma lição no mesmo dia.
      #
      # Fecha **todas** as abertas, de qualquer dia: se a reprodução passou, nenhuma delas
      # ainda descreve o presente. Abrir continua a ser uma por dia.
      - name: A fonte voltou a bater certo
        if: steps.reproducao.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --label fonte --limit 50 --json number \
                       --jq '.[].number'); do
            gh issue close "$n" \
              --comment "A tabela da fonte voltou a bater certo com o calendário dela. Fechada pelo \`dados.yml\`."
          done

      - name: A ronda falhou
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DONO: ${{ github.repository_owner }}
          # **"Não publicou nada" era mentira metade das vezes.** A 12/10/2026 a ronda ficou
          # vermelha depois de publicar com sucesso, e este aviso ia dizer ao dono que o site
          # não tinha sido actualizado. Um aviso que mente sobre o estado do site é pior do
          # que nenhum: manda-o procurar um problema que não existe e esconder-lhe o que é.
          PUBLICOU: ${{ steps.publicacao.outcome }}
        run: |
          gh label create ronda --color B60205 --force \
            --description "a ronda do dados.yml está a falhar" >/dev/null 2>&1 || true

          if [ "$PUBLICOU" = "success" ]; then
            estado="**O site foi publicado** — o que falhou foi depois disso, e os resultados estão no ar."
          else
            estado=$(printf '%s\n' \
              "A ronda **não publicou nada**." \
              "" \
              "Enquanto isto durar, a agenda e os resultados ficam no último commit — e o ciclo" \
              "ao vivo, que lê daí, repete pedidos à associação por jogos que já viu.")
          fi

          titulo="A ronda de dados está a falhar"
          corpo=$(printf '%s\n' \
            "A ronda de $(TZ=Europe/Lisbon date '+%F às %H:%M') falhou." \
            "" \
            "$estado" \
            "" \
            "Corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          n=$(gh issue list --state open --label ronda --limit 20 --json number,title \
                --jq "[.[] | select(.title == \"$titulo\")] | .[0].number // empty")
          # Aqui o comentário por ocorrência **fica**, ao contrário do aviso da fonte: sete
          # rondas falhadas seguidas e uma só não são o mesmo problema, e foi precisamente
          # essa contagem que faltou na noite de 11/10/2026.
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$corpo"
          else
            gh issue create --title "$titulo" --body "$corpo" --label ronda --assignee "$DONO"
          fi

      - name: A ronda voltou ao normal
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --label ronda --limit 20 --json number,title \
                --jq "[.[] | select(.title == \"A ronda de dados está a falhar\")] | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue close "$n" --comment "A ronda voltou a correr. Fechada pelo \`dados.yml\`."
          fi
