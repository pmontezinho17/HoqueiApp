name: Actualizar dados

# Porquê esta cadência e não mais: cada execução custa ~75 pedidos à fonte (a lista de
# competições e um calendário + classificação por prova), e a fonte é um IIS partilhado de
# uma federação, não uma API. A 2h aos fins-de-semana e 6h nos dias úteis dá uma média de
# um pedido a cada dois minutos, e os resultados aparecem no site em menos de duas horas.
# As fichas de jogo são incrementais: só se busca a de um jogo novo ou com resultado novo.
#
# **E num dia sem jogos não se pede nada** — ver o passo "Há razão para pedir à fonte?".
# Estes `cron` disparam todos os dias, mas a ronda sai sem tocar na APL quando a agenda diz
# que hoje não há jogos. Medido a 08/10/2026: eram 28% de tudo o que pediríamos até dezembro.
on:
  schedule:
    # **Fecho do dia, 00:30 WEST.** É a ronda canónica: às 00:30 o dia que acabou está
    # fechado — todos os jogos jogados, todas as fichas disponíveis — e a mesma corrida
    # republica a agenda, que é o que estabelece os jogos de hoje para a ronda ao vivo
    # trabalhar em cima. Um jogo antecipado ou adiado entra por aqui.
    - cron: '30 23 * * *'
    - cron: '0 8-22/2 * * 6,0'   # fins-de-semana, de 2 em 2 horas (UTC)
    - cron: '0 */6 * * 1-5'      # dias úteis, de 6 em 6 horas
    # sexta ao serão: há jornadas às 19:30 e, só com o cron de 6h, o resultado
    # ficava por publicar até às 00:06 — quase cinco horas depois do apito final
    - cron: '0 21 * * 5'
  workflow_dispatch:
    inputs:
      publicar_sempre:
        description: Publicar mesmo sem dados novos (para levar código novo ao site)
        type: boolean
        default: true
      fotografia:
        description: Guardar a fotografia do dia no R2 (a ronda das 00:30 fá-lo sozinha)
        type: boolean
        default: false

concurrency:
  group: dados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`, e isto é o que faz a nova tentativa de `push` funcionar (P11.12).
      #
      # Por omissão o checkout é raso — um commit só — e um `pull --rebase` sobre uma história
      # rasa falha por não encontrar antepassado comum. Medido a 07/10/2026: o repositório
      # inteiro são **2,64 MiB e 137 commits**, portanto trazer tudo não custa nada de
      # relevante. Se um dia a história pesar — os commits de dados são ~10 por dia —, a
      # alternativa é manter o checkout raso e fazer `git fetch --unshallow` só no caminho da
      # nova tentativa.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # ─────────────────────────────────────────────────────────────────────────────────────
      # Num dia sem jogos, não se pede nada à fonte.
      #
      # O dono apanhou-me a 08/10/2026: *"só faz sentido termos pedidos ao site da APL quando
      # eu tenho a certeza de que há jogos nesse dia"*. Medido: nos 9 dias anteriores correram
      # 53 rondas e só 23 trouxeram dados novos. Até dezembro, 28 dias sem jogos valem ~10 900
      # pedidos, dos quais ~8 800 evitáveis — 28% de tudo o que vamos pedir à fonte.
      #
      # A regra vive em `hoquei.vale_pedir`, com nove testes, e não aqui: lógica dentro de um
      # YAML é lógica sem testes. Ela responde sem custar um pedido, lendo a agenda do nosso
      # próprio CDN — e **em dúvida corre**, porque uma ronda a mais custa 75 pedidos e uma a
      # menos custa uma tarde de resultados errados.
      - name: Há razão para pedir à fonte?
        id: vale
        working-directory: scraper
        run: |
          uv run python -m hoquei.vale_pedir \
            --cron "${{ github.event.schedule }}" \
            ${{ inputs.publicar_sempre && '--forcar' || '' }} >> "$GITHUB_OUTPUT"

      - name: Dia sem jogos — nada a pedir à fonte
        if: steps.vale.outputs.correr != 'true'
        run: |
          {
            echo "### Ronda saltada"
            echo ""
            echo "${{ steps.vale.outputs.porque }} — nenhum pedido feito à APL."
            echo ""
            echo "A ronda das 00:30 corre sempre, e é ela que estabelece o dia seguinte."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Testes do parser
        working-directory: scraper
        run: uv run pytest -q

      # B9.6: se as contagens caírem acima do limiar, este passo sai com 2 e os passos
      # seguintes não correm — nem comita, nem publica. O runner é descartável, por isso
      # os dados suspeitos morrem aqui. O diário fica em data-samples/rondas/.
      - name: Regenerar /v1
        if: steps.vale.outputs.correr == 'true'
        working-directory: scraper
        run: uv run python -m hoquei.cli publicar --tenant aplisboa --destino ../web/static/v1/aplisboa/2026-27

      - name: Comitar se houver novidade
        id: commit
        if: steps.vale.outputs.correr == 'true'
        run: |
          # O meta.json tem um carimbo temporal que muda em TODAS as corridas, por isso
          # não serve para decidir se houve novidade: sem o excluir, isto comitava e
          # publicava de 2 em 2 horas para sempre, sem nada ter acontecido nos jogos.
          if git diff --quiet -- web/static/v1 ':!web/static/v1/**/meta.json'; then
            echo "sem alterações nos dados"
            git checkout -- web/static/v1
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mudou=true" >> "$GITHUB_OUTPUT"
          git config user.name  "hoquei-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # O diário das contagens vai no mesmo commit, mas **fora** de web/static/v1:
          # lá dentro, uma linha nova por ronda fazia a verificação acima ver sempre
          # alterações e publicar de 2 em 2 horas para sempre.
          git add web/static/v1 data-samples/rondas
          git commit -m "Dados: $(date -u '+%Y-%m-%d %H:%M') UTC [skip ci]"

          # O `push` com nova tentativa, e não um `push` seco (P11.12).
          #
          # Esta corrida faz `checkout` no início e empurra um a dois minutos depois, com a
          # raspagem pelo meio. Quem commitar nesse intervalo — uma pessoa a publicar uma
          # correcção — faz este `push` ser rejeitado, e com `shell: bash -e` o job morria
          # aqui: a ronda perdia os dados e os passos de construir e publicar ficavam por
          # correr. Aconteceu a 06/10/2026, na corrida 37537581781, e falhou do lado seguro
          # — mas perdeu 150 ficheiros daquela ronda.
          #
          # O `--rebase` é seguro **porque estes ficheiros são gerados e não editados à mão**:
          # o que vem de `origin/main` é dados de uma ronda anterior ou código, e a nossa
          # árvore é a raspagem de agora. O `aovivo.sh` já fazia o equivalente, comparando
          # contra `origin/main:web/static/v1` em vez de assumir que a cópia local está
          # actual; faltava aqui.
          for tentativa in 1 2 3; do
            if git push; then
              echo "publicado no repositório à tentativa $tentativa"
              break
            fi
            if [ "$tentativa" = 3 ]; then
              echo "::error::três tentativas de push rejeitadas — alguém está a commitar sem parar"
              exit 1
            fi
            echo "push rejeitado; a trazer o que chegou entretanto e a tentar outra vez"
            git pull --rebase --autostash origin main
          done

      # Sem este passo o ciclo não fecha: a Action comitava dados novos e o site
      # continuava a servir os antigos até alguém publicar à mão.
      # `mudou` **ou** um pedido manual. Sem a segunda metade, um commit que mexa só em
      # código ficava no repositório sem chegar ao site até os dados mudarem por conta
      # própria — num dia sem jogos, dias.
      - uses: actions/setup-node@v4
        if: steps.vale.outputs.correr == 'true' && (steps.commit.outputs.mudou == 'true' || inputs.publicar_sempre)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Construir a PWA
        if: steps.vale.outputs.correr == 'true' && (steps.commit.outputs.mudou == 'true' || inputs.publicar_sempre)
        working-directory: web
        run: npm ci && npm run build

      # `workingDirectory: web`, e isto não é arrumação.
      #
      # As Pages Functions são lidas da pasta `functions/` **relativa ao sítio de onde o
      # wrangler corre**. Este passo corria da raiz e o `scripts/aovivo.sh` corre de `web/`:
      # com o contador em `web/functions/`, um dos dois publicadores levava-o e o outro
      # publicava sem ele — e durante uma janela de jogos quem publica mais é o ciclo ao vivo.
      # O resultado seria um contador que desaparece ao sábado à tarde e volta sozinho.
      - name: Publicar no Cloudflare Pages
        if: steps.vale.outputs.correr == 'true' && (steps.commit.outputs.mudou == 'true' || inputs.publicar_sempre)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          # **A versão do wrangler, fixada, e isto quebrou uma publicação a 09/10/2026.**
          #
          # Por omissão o `wrangler-action@v3` instala `wrangler@3.90.0` dentro do projecto.
          # Funcionou enquanto o `web/` não tinha wrangler nenhum; no dia em que passou a ter
          # `@cloudflare/workers-types@^5` como dependência de desenvolvimento, o `npm i`
          # rebentou com `ERESOLVE` — a 3.90 pede tipos `^4` por peer dependency.
          #
          # Fixar não é só calar o erro: os **dois publicadores** passam a usar a mesma versão.
          # O `scripts/aovivo.sh` publica com o wrangler local, que é 4.x, e este passo
          # publicava com 3.90 — a mesma espécie de divergência de que fala o comentário do
          # `workingDirectory` acima, e com o mesmo sintoma possível: um sábado em que o que
          # vai para o CDN depende de quem publicou.
          wranglerVersion: '4.149.0'
          command: pages deploy build --project-name hoquei --branch main

      # ───────────────────────────────────────────────────────────────────────────────────
      # A fotografia do dia.
      #
      # **Uma por dia, e só a da ronda das 00:30.** É essa a ronda canónica: às 00:30 o dia
      # que acabou está fechado — todos os jogos jogados, todas as fichas disponíveis. Uma
      # segunda fotografia às 23:00, que o dono chegou a considerar, não acrescentaria nada:
      # o que ela apanhasse seria sempre um dia por fechar, e a das 00:30 apanha-o fechado
      # umas horas depois.
      #
      # **Porquê guardar isto se o git já guarda todas as rondas.** Guarda, e isso foi medido
      # a 09/10/2026: 24 commits de dados, ~278 KB de objectos novos cada um. Dois motivos
      # para a fotografia existir à mesma. O primeiro é a forma: um `tar.gz` de 506 KB
      # devolve o dia inteiro num comando, contra reconstruí-lo de uma árvore git. O segundo
      # é o que vem a seguir: se um dia os commits de dados pesarem de mais — e crescem todos
      # os dias —, a saída é deixar de os commitar, e isso só é possível se o histórico já
      # viver noutro sítio.
      #
      # ~506 KB por dia dão ~185 MB ao ano, contra os 10 GB do plano gratuito do R2.
      - name: Preparar a fotografia do dia
        id: foto
        if: github.event.schedule == '30 23 * * *' || inputs.fotografia
        run: |
          set -euo pipefail
          # **O dia que a fotografia fecha, e não o dia em que foi tirada.** A ronda das 00:30
          # de Lisboa corre já depois da meia-noite, logo o que ela sela é o dia anterior.
          # Antes das 06:00 conta como a madrugada do dia que acabou; depois disso, é o
          # próprio dia — uma fotografia tirada à mão a meio da tarde é provisória, e a ronda
          # das 00:30 da manhã seguinte substitui-a pela definitiva com a mesma chave.
          hora=$(TZ=Europe/Lisbon date +%H)
          if [ "$hora" -lt 06 ]; then
            dia=$(TZ=Europe/Lisbon date -d yesterday +%F)
          else
            dia=$(TZ=Europe/Lisbon date +%F)
          fi
          tar -czf "fotografia.tar.gz" -C web/static v1
          echo "dia=$dia" >> "$GITHUB_OUTPUT"
          echo "Fotografia de $dia — $(du -h fotografia.tar.gz | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      # `continue-on-error`, e é a regra que manda aqui: **uma medição perdida não pode parar
      # a publicação.** Este passo corre depois de os dados já estarem no CDN; se o R2 não
      # estiver ligado, ou o token não tiver permissão, perde-se uma fotografia e mais nada.
      - name: Guardar a fotografia no R2
        if: steps.foto.outcome == 'success'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          command: >-
            r2 object put
            ok4sticks-historico/fotografias/${{ steps.foto.outputs.dia }}.tar.gz
            --file=fotografia.tar.gz
            --content-type=application/gzip
            --remote
