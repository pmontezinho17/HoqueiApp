name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # os testes correm contra HTML gravado, sem rede: não tocam na fonte
      # Os marcados `fonte` ficam de fora do que bloqueia: eles comparam o nosso cálculo com
      # a tabela que a APL publica **naquele momento**, e por isso ficam vermelhos quando ela
      # está incoerente consigo mesma — coisa que nenhum commit nosso resolve. Ver o
      # `conftest.py` e o `dados.yml`.
      - run: uv run pytest -q -m "not fonte"
        working-directory: scraper

      - name: Reprodução das tabelas da fonte (informativo)
        working-directory: scraper
        continue-on-error: true
        run: uv run pytest -q -m fonte

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
