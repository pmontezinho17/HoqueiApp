name: Acompanhar jogos ao vivo

# A sonda de 02/10 provou que a fonte reflecte os golos enquanto o jogo decorre, e a
# medição de 03/10 — com o dono do projecto na bancada a cronometrar — deu ~20 s da mesa
# mais ~15 s nossos. Menos de um minuto de ponta a ponta. Isto é o que torna esse minuto
# possível sem ninguém à frente de um computador.
#
# Custo à fonte: um pedido por jogo a decorrer e por ronda. No pico da época são 15 jogos
# à mesma hora, logo 15 pedidos por ronda de 30 s — uma média de um pedido a cada 2 s,
# contra um jogo que a federação já está a publicar ao vivo no seu próprio site. E o ciclo
# sai quando não há nada a decorrer e o próximo jogo ainda está a mais de 40 minutos, por
# isso o custo é pelas janelas dos jogos e não pelo relógio.
on:
  schedule:
    # **Uma rede, não três disparos.** A 04/10, um sábado inteiro de jogos, as três
    # corridas agendadas deste workflow foram **todas** perdidas — as quatro que correram
    # tinham sido lançadas à mão. E não é atraso de fila: medido, o tempo entre a criação e
    # o arranque de cada corrida agendada é 0 s. A GitHub não atrasa as corridas, não as
    # cria. No mesmo dia o `dados.yml` perdeu 6 das 8 dele.
    #
    # Com 30 tentativas em vez de 3, basta uma acertar de manhã: o ciclo dura 5 h e a
    # `concurrency` abaixo transforma cada disparo seguinte em revezamento — uma corrida
    # que dispare com outra a correr fica em espera e arranca mal a primeira acabe. É
    # auto-encadeamento sem precisar de um token pessoal, que o `GITHUB_TOKEN` não pode
    # fazer por desenho (uma Action não dispara outra com ele).
    #
    # Uma corrida que não tenha nada para fazer custa ~40 s e sai.
    - cron: '0,30 7-21 * * 6,0'   # fins-de-semana, 08:00–22:30 WEST
    - cron: '0,30 16-21 * * 5'    # sexta ao serão
    - cron: '0,30 17-20 * * 1-4'  # jogos remarcados para dias úteis
  workflow_dispatch:
    inputs:
      minutos:
        description: Duração máxima do ciclo
        default: '300'
      intervalo:
        description: Segundos entre rondas
        default: '30'

concurrency:
  group: aovivo
  cancel-in-progress: false

# Só leitura: este ciclo publica no CDN e **não** comita. Ver scripts/aovivo.sh.
permissions:
  contents: read

jobs:
  seguir:
    runs-on: ubuntu-latest
    timeout-minutes: 310     # 300 de ciclo + margem para o build inicial (máx. da GitHub: 360)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # O build completo corre uma vez; dentro do ciclo só se copiam os JSON, que poupa
      # ~10 s por ronda e é tudo o que muda durante um jogo.
      - name: Construir a PWA uma vez
        working-directory: web
        run: npm ci && npm run build

      - name: Seguir os jogos
        run: ./scripts/aovivo.sh
        env:
          MINUTOS: ${{ inputs.minutos || '300' }}
          INTERVALO: ${{ inputs.intervalo || '30' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Quem este ciclo acorda a cada ronda, além de publicar — ver o fim do `aovivo.sh`.
          OBSERVADOR: https://hoquei-observador.torneiopa.workers.dev
