name: Acompanhar jogos ao vivo

# A sonda de 02/10 provou que a fonte reflecte os golos enquanto o jogo decorre, e a
# medição de 03/10 — com o dono do projecto na bancada a cronometrar — deu ~20 s da mesa
# mais ~15 s nossos. Menos de um minuto de ponta a ponta. Isto é o que torna esse minuto
# possível sem ninguém à frente de um computador.
#
# Custo à fonte: um pedido por jogo a decorrer e por ronda. No pico da época são 15 jogos
# à mesma hora, logo 15 pedidos por ronda de 45 s — uma média de um pedido a cada 3 s,
# contra um jogo que a federação já está a publicar ao vivo no seu próprio site.
on:
  schedule:
    # Fins-de-semana: três janelas de ~4h20 a cobrir 09:30–22:00 WEST, **meia hora antes**
    # do primeiro jogo. O agendador da GitHub atrasa-se — 18 minutos medidos na sonda de
    # 02/10, e a 04/10 às 09:03 UTC a corrida das 09:00 ainda não tinha arrancado. Pedir às
    # 08:30 para cobrir um jogo das 10:00 é a única forma de não perder o início.
    #
    # As janelas sobrepõem-se de propósito: com `concurrency` a segunda espera pela
    # primeira, e é a espera que fecha as falhas em vez de as abrir.
    - cron: '30 8,12,16 * * 6,0'
    - cron: '30 17 * * 5'       # sexta ao serão, onde há jornadas às 19:30
  workflow_dispatch:
    inputs:
      minutos:
        description: Duração máxima do ciclo
        default: '260'
      intervalo:
        description: Segundos entre rondas
        default: '45'

concurrency:
  group: aovivo
  cancel-in-progress: false

# Só leitura: este ciclo publica no CDN e **não** comita. Ver scripts/aovivo.sh.
permissions:
  contents: read

jobs:
  seguir:
    runs-on: ubuntu-latest
    timeout-minutes: 280     # 260 de ciclo + margem para o build inicial
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # O build completo corre uma vez; dentro do ciclo só se copiam os JSON, que poupa
      # ~10 s por ronda e é tudo o que muda durante um jogo.
      - name: Construir a PWA uma vez
        working-directory: web
        run: npm ci && npm run build

      - name: Seguir os jogos
        run: ./scripts/aovivo.sh
        env:
          MINUTOS: ${{ inputs.minutos || '260' }}
          INTERVALO: ${{ inputs.intervalo || '45' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
