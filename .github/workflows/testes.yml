name: Site de testes

# Um segundo site, para experimentar no telemóvel sem tocar no que as pessoas usam (P11.7).
#
# O Cloudflare Pages dá um *preview deployment* por ramo sem custo: publicar com
# `--branch testes` no mesmo projecto dá o endereço `https://testes.hoquei.pages.dev`, com o
# `main` a continuar intocado em `hoquei.pages.dev`.
#
# **Isto não raspa nada.** Publica os dados que já estão commitados, e é de propósito: a regra
# do projecto é uma raspagem central, nunca uma por ambiente — o servidor da associação não
# tem de pagar o nosso ambiente de testes. Em troca, os dados do site de testes são os do
# último commit de dados, que pode estar algumas horas atrás. Para experimentar interface é o
# que se quer; para ver resultados ao vivo, o site a sério é o outro.
#
# O contador de utilização fica **calado** aqui, e também é de propósito: a ligação ao KV
# está no ambiente de *Production* do projecto, e o middleware foi escrito para ser um
# `next()` quando não a encontra. Assim o tráfego de testes não entra nas contagens reais.
#
# ## Este site está trancado desde 10/10/2026
#
# Aquele "algumas horas atrás" era uma limitação conhecida e passou a ser um problema no dia
# em que **este** endereço foi partilhado por engano em vez do de produção. Com 36 jogos a
# decorrer, quem seguiu o link via dados de 26 horas antes e nem um resultado do dia.
#
# Agora qualquer navegação a um `*.hoquei.pages.dev` que não seja o site a sério apanha a
# porta do `web/functions/_middleware.js`: uma página que diz onde é o site verdadeiro, com um
# botão, e que só deixa passar quem escreva a `CHAVE_TESTES`. **Esse segredo define-se no
# ambiente `Preview` do projecto, no painel da Cloudflare** — sem ele a porta não deixa entrar
# ninguém, de propósito. O raciocínio todo está em `docs/03-backlog.md`.

on:
  push:
    branches: [testes]
  workflow_dispatch:

concurrency:
  group: testes
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Os mesmos testes do `ci.yml`: um site de testes com código que não passa os testes
      # serve para enganar quem o abre.
      - name: Testes da PWA
        working-directory: web
        run: npm ci && npm run check && npx vitest run

      # `VITE_APP_NOME` é o que separa este site da principal, e existe por uma razão
      # prática: com os dois instalados no mesmo telemóvel, dois ícones com o mesmo nome
      # debaixo não se distinguem — e acaba-se a reportar um defeito do sítio errado.
      - name: Construir a PWA
        working-directory: web
        env:
          VITE_APP_NOME: OK4Sticks.DEV
        run: npm run build

      # `workingDirectory: web` pela mesma razão do `dados.yml`: as Pages Functions são lidas
      # da pasta `functions/` relativa ao sítio de onde o wrangler corre.
      - name: Publicar no ramo de testes
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          # **A versão do wrangler, fixada, e isto quebrou uma publicação a 09/10/2026.**
          #
          # Por omissão o `wrangler-action@v3` instala `wrangler@3.90.0` dentro do projecto.
          # Funcionou enquanto o `web/` não tinha wrangler nenhum; no dia em que passou a ter
          # `@cloudflare/workers-types@^5` como dependência de desenvolvimento, o `npm i`
          # rebentou com `ERESOLVE` — a 3.90 pede tipos `^4` por peer dependency.
          #
          # Fixar não é só calar o erro: os **dois publicadores** passam a usar a mesma versão.
          # O `scripts/aovivo.sh` publica com o wrangler local, que é 4.x, e este passo
          # publicava com 3.90 — a mesma espécie de divergência de que fala o comentário do
          # `workingDirectory` acima, e com o mesmo sintoma possível: um sábado em que o que
          # vai para o CDN depende de quem publicou.
          wranglerVersion: '4.149.0'
          command: pages deploy build --project-name hoquei --branch testes

      - name: Onde ficou
        run: echo "### Site de testes → https://testes.hoquei.pages.dev" >> "$GITHUB_STEP_SUMMARY"
