<!doctype html>
<!-- pt-PT, e não en: o leitor de ecrã escolhe a voz por este atributo, e em inglês
     lê "Paço de Arcos" e "Vilafranquense" de forma incompreensível -->
<html lang="pt-PT">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<!-- a barra do browser acompanha o tema do sistema -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1115" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="OK4Sticks" />
		<link rel="apple-touch-icon" href="/icones/icone-192.png" />
		<!--
		  O tema escolhido à mão tem de entrar no <html> **antes da primeira pintura**.
		  Em linha e síncrono de propósito: o resto da app só decide cores depois de o pacote
		  de JavaScript carregar e hidratar, e até lá quem escolheu escuro num telemóvel claro
		  via a app branca e só depois escura. Medido a 06/10/2026 em `localhost`, com rede e
		  cache ideais: este script corre aos 22 ms e o último módulo do cliente só chega aos
		  74 ms. São 52 ms de relâmpago no melhor caso possível — num telemóvel e numa rede de
		  pavilhão o intervalo cresce com elas, enquanto isto fica preso ao próprio HTML.
		  A barra do browser não se corrige aqui — fica para o `tema.svelte.ts`: duplicar as
		  cores num terceiro sítio custa mais do que a barra acertar um instante mais tarde.
		-->
		<script>
			try {
				var t = localStorage.getItem('hoquei:tema:v1');
				if (t === 'claro' || t === 'escuro') {
					document.documentElement.dataset.tema = t;
					document.documentElement.style.colorScheme = t === 'escuro' ? 'dark' : 'light';
				}
			} catch (e) {
				// armazenamento bloqueado: fica o tema do sistema
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
