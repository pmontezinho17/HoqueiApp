[project]
name = "hoquei-scraper"
version = "0.1.0"
description = "Scraper das competições de hóquei em patins da plataforma Assys Software"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "selectolax>=0.3.21"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/hoquei"]
